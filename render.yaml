services:
  - type: web
    name: caraboa-express-pos
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 20.18.0
      # PIN para editar la carta. Render genera uno al azar; puedes cambiarlo en Environment.
      - key: ADMIN_PIN
        generateValue: true
      # Clave del encargado: carga y edita datos, pero no borra ni cambia ajustes sensibles.
      # Se escribe a mano en el panel de Render (Environment).
      - key: MANAGER_PIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: caraboa-express-db
          property: connectionString

databases:
  - name: caraboa-express-db
    plan: free
    region: oregon
